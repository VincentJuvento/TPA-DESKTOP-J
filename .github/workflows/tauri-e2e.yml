name: Tauri E2E

on:
  push:
    paths:
      - 'rusa-app/**'
      - '.github/workflows/tauri-e2e.yml'
  pull_request:
    paths:
      - 'rusa-app/**'
      - '.github/workflows/tauri-e2e.yml'

jobs:
  tauri-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rusa
          POSTGRES_PASSWORD: rusa
          POSTGRES_DB: rusa_ims_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rusa -d rusa_ims_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://rusa:rusa@localhost:5432/rusa_ims_test
      REDIS_URL: redis://127.0.0.1/

    defaults:
      run:
        working-directory: rusa-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          WEBKIT_40_PKG=""
          if apt-cache show libwebkit2gtk-4.0-dev >/dev/null 2>&1; then
            WEBKIT_40_PKG="libwebkit2gtk-4.0-dev"
          fi

          INDICATOR_PKG="libayatana-appindicator3-dev"
          if apt-cache show libappindicator3-dev >/dev/null 2>&1; then
            INDICATOR_PKG="libappindicator3-dev"
          fi

          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            $WEBKIT_40_PKG \
            libwebkit2gtk-4.1-dev \
            $INDICATOR_PKG \
            librsvg2-dev \
            postgresql-client \
            patchelf \
            xvfb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rusa-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres

      - name: Run core SQL migrations (up to v12)
        run: sqlx migrate run --source migrations --target-version 12

      - name: Bootstrap legacy aerospace task table for migration compatibility
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS aerospace_assigned_tasks (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            title TEXT NOT NULL,
            description TEXT,
            assigned_to UUID REFERENCES users(id),
            assigned_by UUID REFERENCES users(id),
            status TEXT NOT NULL DEFAULT 'pending',
            progress_notes TEXT,
            due_date TIMESTAMPTZ,
            created_at TIMESTAMPTZ DEFAULT NOW(),
            deleted_at TIMESTAMPTZ,
            conclusion_requested_at TIMESTAMPTZ,
            conclusion_requested_by UUID REFERENCES users(id),
            conclusion_approved_at TIMESTAMPTZ,
            conclusion_approved_by UUID REFERENCES users(id),
            final_notes TEXT,
            final_findings TEXT,
            methodology_summary TEXT,
            key_results TEXT,
            recommendations TEXT,
            limitations TEXT
          );
          SQL

      - name: Run remaining SQL migrations
        run: sqlx migrate run --source migrations

      - name: Run Tauri E2E tests
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          GDK_BACKEND: x11
        run: xvfb-run -a npm run test:e2e
