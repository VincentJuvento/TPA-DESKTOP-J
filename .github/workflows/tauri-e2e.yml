name: Tauri E2E

on:
  push:
    paths:
      - 'rusa-app/**'
      - '.github/workflows/tauri-e2e.yml'
  pull_request:
    paths:
      - 'rusa-app/**'
      - '.github/workflows/tauri-e2e.yml'

jobs:
  tauri-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rusa
          POSTGRES_PASSWORD: rusa
          POSTGRES_DB: rusa_ims_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rusa -d rusa_ims_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://rusa:rusa@localhost:5432/rusa_ims_test
      REDIS_URL: redis://127.0.0.1/

    defaults:
      run:
        working-directory: /home/runner/work/TPA-DESKTOP-J/TPA-DESKTOP-J/rusa-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: /home/runner/work/TPA-DESKTOP-J/TPA-DESKTOP-J/rusa-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres

      - name: Run SQL migrations
        run: sqlx migrate run --source migrations

      - name: Run Tauri E2E tests
        run: xvfb-run -a npm run test:e2e
